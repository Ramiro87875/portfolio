<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Chatbot de Atendimento — Projeto demonstrativo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#d1d7db;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.demo{width:100%;background:#111b21;color:#fff;text-align:center;font-size:13px;padding:6px}.demo a{color:#8fe3b5}
.phone{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;background:#efeae2 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='5' cy='5' r='1.3' fill='%23d9d2c8'/></svg>");height:calc(100vh - 30px)}
.top{background:#008069;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:#fff;color:#008069;display:flex;align-items:center;justify-content:center;font-weight:700}
.top small{opacity:.8}
#log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:7px 10px 16px;border-radius:8px;font-size:14.5px;line-height:1.4;position:relative;white-space:pre-wrap;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.m.b{background:#fff;align-self:flex-start}.m.u{background:#d9fdd3;align-self:flex-end}
.m time{position:absolute;right:8px;bottom:2px;font-size:10.5px;opacity:.5}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}.opts button{border:1px solid #008069;color:#008069;background:#fff;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:13px}
form{display:flex;gap:8px;padding:8px;background:#f0f2f5}form input{flex:1;border:0;border-radius:20px;padding:11px 14px;font-size:15px}
form button{width:44px;border:0;border-radius:50%;background:#008069;color:#fff;font-size:18px;cursor:pointer}
.typing{font-style:italic;opacity:.6}
</style></head><body>
<div class="demo">Projeto demonstrativo — simulação no navegador, sem envio real · <a href="../">voltar ao portfólio</a></div>
<div class="phone"><div class="top"><div class="av">CB</div><div><b>Clínica Bem-Estar (fictícia)</b><br><small>assistente virtual · online</small></div></div>
<div id="log"></div><form id="f"><input id="i" placeholder="Digite uma mensagem ou número do menu" autocomplete="off"><button>➤</button></form></div>
<script>
const log=document.getElementById('log');let state='menu',name='';
const MENU='Como posso ajudar? Responda com o número:\n1️⃣ Horários e endereço\n2️⃣ Agendar consulta\n3️⃣ Valores e convênios\n4️⃣ Perguntas frequentes\n5️⃣ Falar com um atendente';
const FAQ={'estacionamento':'Temos estacionamento conveniado ao lado (exemplo fictício).','pix':'Aceitamos Pix, cartão de crédito e débito.','cancelar':'Para cancelar, avise com 24h de antecedência respondendo "2" e informando a data.','online':'Sim, oferecemos teleconsulta para retornos.'};
const t=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function add(txt,who){const d=document.createElement('div');d.className='m '+who;d.textContent=txt;const s=document.createElement('time');s.textContent=t();d.append(s);log.append(d);log.scrollTop=1e9}
function opts(list){const d=document.createElement('div');d.className='opts';list.forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{d.remove();send(v)};d.append(b)});log.append(d);log.scrollTop=1e9}
function bot(txt,o){const ty=document.createElement('div');ty.className='m b typing';ty.textContent='digitando...';log.append(ty);log.scrollTop=1e9;
setTimeout(()=>{ty.remove();add(txt,'b');if(o)opts(o)},600)}
const menuOpts=[['1 Horários','1'],['2 Agendar','2'],['3 Valores','3'],['4 FAQ','4'],['5 Atendente','5']];
function reply(m){const x=m.toLowerCase().trim();
if(state=='nome'){name=m.trim();state='menu';return bot(`Prazer, ${name}! 😊\n\n${MENU}`,menuOpts)}
if(state=='agenda'){state='menu';return bot(`Anotado: preferência por "${m}". ✅\nNa versão real, o bot consultaria a agenda e confirmaria o horário automaticamente.\n\nDigite "menu" para voltar.`,[['Menu','menu']])}
if(state=='faq'){const k=Object.keys(FAQ).find(k=>x.includes(k));if(k){return bot(FAQ[k]+'\n\nOutra dúvida? Ou digite "menu".',[['Menu','menu']])}
state='menu';return bot('Não encontrei essa resposta. Vou te encaminhar para um atendente humano. 👩‍💼',null),setTimeout(human,900)}
if(['menu','oi','olá','ola','0'].includes(x))return bot(MENU,menuOpts);
if(x=='1')return bot('🕘 Seg a sex, 8h às 18h · Sáb, 8h às 12h\n📍 Rua Exemplo, 123 — Centro (endereço fictício)',[['Menu','menu']]);
if(x=='2'){state='agenda';return bot('Qual dia e período você prefere? (ex.: "terça à tarde")')}
if(x=='3')return bot('Consulta particular: R$ 000 (valor ilustrativo).\nConvênios: lista configurável pelo cliente.',[['Menu','menu']]);
if(x=='4'){state='faq';return bot('Pergunte à vontade! Exemplos: estacionamento, pix, cancelar, online.',[['Aceitam Pix?','pix'],['Tem estacionamento?','estacionamento'],['Como cancelar?','cancelar']])}
if(x=='5')return human();
bot('Desculpe, não entendi. 🤔\n\n'+MENU,menuOpts)}
function human(){bot(`Certo${name?', '+name:''}! Transferi sua conversa para nossa equipe. Um atendente responderá em breve.\n\n(Na versão real: notificação para o atendente + histórico da conversa + fila de espera.)`,[['Voltar ao menu','menu']])}
function send(v){add(v,'u');reply(v)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('i');if(i.value.trim()){send(i.value);i.value=''}};
bot('Olá! 👋 Sou o assistente virtual da Clínica Bem-Estar.\nQual é o seu nome?');state='nome';
</script></body></html>
